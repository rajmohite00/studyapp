<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>StudyFlow AI - Test Taking</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-fixed": "#e1e2e4",
                        "on-tertiary-container": "#ebecf0",
                        "surface": "#f9f9ff",
                        "on-error-container": "#93000a",
                        "primary": "#532cd8",
                        "on-primary-container": "#f0eaff",
                        "outline-variant": "#c9c4d8",
                        "secondary": "#5c5f60",
                        "tertiary": "#505356",
                        "on-secondary-fixed-variant": "#444749",
                        "error-container": "#ffdad6",
                        "on-tertiary-fixed-variant": "#44474a",
                        "on-background": "#141b2b",
                        "inverse-surface": "#293040",
                        "on-secondary": "#ffffff",
                        "surface-container-highest": "#dce2f7",
                        "inverse-primary": "#c9beff",
                        "tertiary-container": "#686b6f",
                        "on-tertiary-fixed": "#191c1f",
                        "on-primary-fixed-variant": "#4616cc",
                        "surface-tint": "#5f3ce4",
                        "outline": "#797587",
                        "surface-container-low": "#f1f3ff",
                        "primary-fixed-dim": "#c9beff",
                        "surface-container-lowest": "#ffffff",
                        "on-error": "#ffffff",
                        "on-primary": "#ffffff",
                        "tertiary-fixed-dim": "#c4c7ca",
                        "primary-container": "#6c4cf1",
                        "tertiary-fixed": "#e0e2e6",
                        "on-surface": "#141b2b",
                        "on-secondary-fixed": "#191c1e",
                        "secondary-container": "#dee0e2",
                        "surface-variant": "#dce2f7",
                        "on-primary-fixed": "#1b0062",
                        "error": "#ba1a1a",
                        "on-secondary-container": "#606365",
                        "background": "#f9f9ff",
                        "surface-container-high": "#e1e8fd",
                        "surface-container": "#e9edff",
                        "primary-fixed": "#e6deff",
                        "inverse-on-surface": "#edf0ff",
                        "secondary-fixed-dim": "#c5c7c8",
                        "on-surface-variant": "#484555",
                        "on-tertiary": "#ffffff",
                        "surface-dim": "#d3daef",
                        "surface-bright": "#f9f9ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "base": "4px",
                        "sm": "12px",
                        "margin-mobile": "20px",
                        "lg": "24px",
                        "md": "16px",
                        "xl": "32px",
                        "xs": "8px",
                        "gutter": "12px"
                    },
                    "fontFamily": {
                        "body-lg": ["Inter"],
                        "display": ["Inter"],
                        "headline-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "label-md": ["Inter"]
                    },
                    "fontSize": {
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "display": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "headline-lg": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-lg-mobile": ["22px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.01em", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Custom radio button styles */
        .option-card input[type="radio"]:checked + div {
            border-color: #6c4cf1;
            background-color: rgba(108, 76, 241, 0.05);
        }
        .option-card input[type="radio"]:checked + div .radio-inner {
            background-color: #6c4cf1;
            border-color: #6c4cf1;
        }
        .option-card input[type="radio"]:checked + div .radio-inner::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: white;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface-container-lowest text-on-surface h-screen flex flex-col font-sans overflow-hidden antialiased">
<!-- Header / Progress Area -->
<header class="w-full px-margin-mobile pt-lg pb-md flex flex-col gap-sm bg-surface-container-lowest z-10 shrink-0">
<div class="flex justify-between items-center w-full">
<!-- Close / Exit -->
<button class="p-2 -ml-2 text-on-surface-variant hover:text-on-surface transition-colors rounded-full hover:bg-surface-container-low focus:outline-none">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<!-- Question Counter -->
<div class="font-headline-md text-headline-md text-on-surface">
                Question 4 <span class="text-on-surface-variant font-normal">of 20</span>
</div>
<!-- Timer -->
<div class="flex items-center gap-2 text-primary-container font-headline-md text-headline-md bg-primary-container/10 px-3 py-1 rounded-full">
<span class="material-symbols-outlined text-[20px]" data-icon="timer">timer</span>
<span>12:45</span>
</div>
</div>
<!-- Progress Bar -->
<div class="w-full h-[6px] bg-secondary-fixed rounded-full overflow-hidden mt-xs">
<div class="h-full bg-primary-container rounded-full w-1/5 transition-all duration-300 ease-out"></div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 w-full max-w-[800px] mx-auto px-margin-mobile py-lg overflow-y-auto flex flex-col">
<!-- Question Text -->
<div class="mb-xl">
<h1 class="font-display text-display text-on-surface mb-md">
                Which of the following best describes the principle of "cognitive load" in educational psychology?
            </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">
                Consider the implications for instructional design and how working memory capacity affects learning outcomes.
            </p>
</div>
<!-- Options Container -->
<div class="flex flex-col gap-sm flex-1">
<!-- Option A -->
<label class="option-card relative cursor-pointer group w-full">
<input class="sr-only" name="question4" type="radio" value="A"/>
<div class="w-full bg-[#F7F8FA] border border-[#E5E7EB] rounded-xl p-md flex items-start gap-md transition-all duration-200 hover:border-primary-container/50">
<div class="radio-inner relative w-6 h-6 rounded-full border-2 border-outline-variant shrink-0 mt-[2px] transition-colors duration-200 flex items-center justify-center"></div>
<div class="flex-1">
<span class="font-body-lg text-body-lg text-on-surface block">
                            The total amount of mental effort being used in the working memory during problem-solving or learning.
                        </span>
</div>
</div>
</label>
<!-- Option B -->
<label class="option-card relative cursor-pointer group w-full">
<input class="sr-only" name="question4" type="radio" value="B"/>
<div class="w-full bg-[#F7F8FA] border border-[#E5E7EB] rounded-xl p-md flex items-start gap-md transition-all duration-200 hover:border-primary-container/50">
<div class="radio-inner relative w-6 h-6 rounded-full border-2 border-outline-variant shrink-0 mt-[2px] transition-colors duration-200 flex items-center justify-center"></div>
<div class="flex-1">
<span class="font-body-lg text-body-lg text-on-surface block">
                            The physiological capacity of the brain to store long-term memories indefinitely.
                        </span>
</div>
</div>
</label>
<!-- Option C -->
<label class="option-card relative cursor-pointer group w-full">
<input class="sr-only" name="question4" type="radio" value="C"/>
<div class="w-full bg-[#F7F8FA] border border-[#E5E7EB] rounded-xl p-md flex items-start gap-md transition-all duration-200 hover:border-primary-container/50">
<div class="radio-inner relative w-6 h-6 rounded-full border-2 border-outline-variant shrink-0 mt-[2px] transition-colors duration-200 flex items-center justify-center"></div>
<div class="flex-1">
<span class="font-body-lg text-body-lg text-on-surface block">
                            The process by which students transfer knowledge from working memory to sensory memory.
                        </span>
</div>
</div>
</label>
<!-- Option D -->
<label class="option-card relative cursor-pointer group w-full">
<input class="sr-only" name="question4" type="radio" value="D"/>
<div class="w-full bg-[#F7F8FA] border border-[#E5E7EB] rounded-xl p-md flex items-start gap-md transition-all duration-200 hover:border-primary-container/50">
<div class="radio-inner relative w-6 h-6 rounded-full border-2 border-outline-variant shrink-0 mt-[2px] transition-colors duration-200 flex items-center justify-center"></div>
<div class="flex-1">
<span class="font-body-lg text-body-lg text-on-surface block">
                            The emotional resistance a student feels when presented with overly complex or poorly structured information.
                        </span>
</div>
</div>
</label>
</div>
<!-- Bottom spacing for mobile to ensure scroll clears footer -->
<div class="h-24 md:h-8"></div>
</main>
<!-- Footer Actions -->
<footer class="w-full bg-surface-container-lowest border-t border-outline-variant/30 px-margin-mobile py-md flex justify-between items-center z-10 shrink-0 pb-safe pb-8 md:pb-md">
<button class="flex items-center gap-2 bg-[#F7F8FA] text-[#111827] px-6 py-3 rounded-xl font-headline-md text-headline-md hover:bg-secondary-fixed transition-colors focus:outline-none focus:ring-2 focus:ring-primary-container focus:ring-offset-2">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
            Previous
        </button>
<button class="flex items-center gap-2 bg-primary-container text-white px-8 py-3 rounded-xl font-headline-md text-headline-md hover:bg-primary-container/90 transition-colors focus:outline-none focus:ring-2 focus:ring-primary-container focus:ring-offset-2 active:scale-95 duration-100">
            Next
            <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</footer>
</body></html>
