<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Test Configuration Flow - StudyFlow AI</title>
<!-- Fonts & Icons -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-fixed": "#e1e2e4",
                        "on-tertiary-container": "#ebecf0",
                        "surface": "#f9f9ff",
                        "on-error-container": "#93000a",
                        "primary": "#532cd8",
                        "on-primary-container": "#f0eaff",
                        "outline-variant": "#c9c4d8",
                        "secondary": "#5c5f60",
                        "tertiary": "#505356",
                        "on-secondary-fixed-variant": "#444749",
                        "error-container": "#ffdad6",
                        "on-tertiary-fixed-variant": "#44474a",
                        "on-background": "#141b2b",
                        "inverse-surface": "#293040",
                        "on-secondary": "#ffffff",
                        "surface-container-highest": "#dce2f7",
                        "inverse-primary": "#c9beff",
                        "tertiary-container": "#686b6f",
                        "on-tertiary-fixed": "#191c1f",
                        "on-primary-fixed-variant": "#4616cc",
                        "surface-tint": "#5f3ce4",
                        "outline": "#797587",
                        "surface-container-low": "#f1f3ff",
                        "primary-fixed-dim": "#c9beff",
                        "surface-container-lowest": "#ffffff",
                        "on-error": "#ffffff",
                        "on-primary": "#ffffff",
                        "tertiary-fixed-dim": "#c4c7ca",
                        "primary-container": "#6c4cf1",
                        "tertiary-fixed": "#e0e2e6",
                        "on-surface": "#141b2b",
                        "on-secondary-fixed": "#191c1e",
                        "secondary-container": "#dee0e2",
                        "surface-variant": "#dce2f7",
                        "on-primary-fixed": "#1b0062",
                        "error": "#ba1a1a",
                        "on-secondary-container": "#606365",
                        "background": "#f9f9ff",
                        "surface-container-high": "#e1e8fd",
                        "surface-container": "#e9edff",
                        "primary-fixed": "#e6deff",
                        "inverse-on-surface": "#edf0ff",
                        "secondary-fixed-dim": "#c5c7c8",
                        "on-surface-variant": "#484555",
                        "on-tertiary": "#ffffff",
                        "surface-dim": "#d3daef",
                        "surface-bright": "#f9f9ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "base": "4px",
                        "sm": "12px",
                        "margin-mobile": "20px",
                        "lg": "24px",
                        "md": "16px",
                        "xl": "32px",
                        "xs": "8px",
                        "gutter": "12px"
                    },
                    "fontFamily": {
                        "body-lg": ["Inter"],
                        "display": ["Inter"],
                        "headline-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "label-md": ["Inter"]
                    },
                    "fontSize": {
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "display": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "headline-lg": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-lg-mobile": ["22px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.01em", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
<style>
        /* Hide scrollbar for clean horizontal scrolling */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
    </style>
</head>
<body class="bg-background min-h-screen flex flex-col font-body-lg text-on-background selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar (Brand Anchor) -->
<!-- Modified leading icon for transactional flow (back instead of avatar) to fit context, while maintaining brand JSON styles -->
<header class="bg-surface dark:bg-on-background docked full-width top-0 flat no shadows flex justify-between items-center px-margin-mobile py-sm w-full sticky z-50">
<button class="text-primary dark:text-primary-fixed hover:opacity-80 transition-opacity active:scale-95 duration-100 flex items-center justify-center w-[40px] h-[40px] rounded-full hover:bg-surface-variant">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary dark:text-primary-fixed">
            StudyFlow AI
        </h1>
<button class="text-primary dark:text-primary-fixed hover:opacity-80 transition-opacity active:scale-95 duration-100 flex items-center justify-center w-[40px] h-[40px] rounded-full hover:bg-surface-variant">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">notifications</span>
</button>
</header>
<!-- Main Content Canvas (Transactional Flow - Bottom Nav Suppressed) -->
<main class="flex-1 flex flex-col px-margin-mobile py-lg gap-lg max-w-2xl mx-auto w-full pb-[100px]">
<!-- Header & Progress -->
<div class="flex flex-col gap-xs mb-sm">
<h2 class="font-display text-display text-on-surface">Configure Test</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Customize your practice session parameters.</p>
<!-- Progress Bar -->
<div class="w-full h-[6px] bg-surface-variant rounded-full mt-sm overflow-hidden">
<div class="h-full bg-primary-container rounded-full w-[75%] transition-all duration-500"></div>
</div>
</div>
<!-- STEP 1: Subject Selection (Bento/Card Grid) -->
<section class="flex flex-col gap-md">
<h3 class="font-headline-md text-headline-md text-on-surface flex items-center gap-xs">
<span class="flex items-center justify-center w-6 h-6 rounded-full bg-surface-variant text-on-surface-variant font-label-md text-label-md">1</span>
                Select Subject
            </h3>
<div class="grid grid-cols-2 md:grid-cols-3 gap-sm">
<!-- Subject Card (Inactive) -->
<button class="bg-surface-container-lowest border border-outline-variant rounded-xl p-md flex flex-col items-center justify-center gap-xs hover:border-primary-container hover:bg-surface-container transition-all active:scale-98">
<span class="material-symbols-outlined text-secondary text-[32px]" style="font-variation-settings: 'FILL' 0;">terminal</span>
<span class="font-body-md text-body-md font-medium">Java</span>
</button>
<!-- Subject Card (Active state example) -->
<button class="bg-primary-container/5 border border-primary-container ring-1 ring-primary-container rounded-xl p-md flex flex-col items-center justify-center gap-xs transition-all active:scale-98 relative overflow-hidden">
<div class="absolute top-2 right-2">
<span class="material-symbols-outlined text-primary-container text-[18px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<span class="material-symbols-outlined text-primary-container text-[32px]" style="font-variation-settings: 'FILL' 0;">code</span>
<span class="font-body-md text-body-md font-medium text-primary-container">Python</span>
</button>
<!-- Subject Card (Inactive) -->
<button class="bg-surface-container-lowest border border-outline-variant rounded-xl p-md flex flex-col items-center justify-center gap-xs hover:border-primary-container hover:bg-surface-container transition-all active:scale-98">
<span class="material-symbols-outlined text-secondary text-[32px]" style="font-variation-settings: 'FILL' 0;">database</span>
<span class="font-body-md text-body-md font-medium">DBMS</span>
</button>
<!-- Subject Card (Inactive) -->
<button class="bg-surface-container-lowest border border-outline-variant rounded-xl p-md flex flex-col items-center justify-center gap-xs hover:border-primary-container hover:bg-surface-container transition-all active:scale-98">
<span class="material-symbols-outlined text-secondary text-[32px]" style="font-variation-settings: 'FILL' 0;">memory</span>
<span class="font-body-md text-body-md font-medium">OS</span>
</button>
<!-- Subject Card (Custom) -->
<button class="bg-surface-container-lowest border border-dashed border-outline-variant rounded-xl p-md flex flex-col items-center justify-center gap-xs hover:border-primary-container hover:bg-surface-container transition-all active:scale-98 col-span-2 md:col-span-1">
<span class="material-symbols-outlined text-secondary text-[32px]" style="font-variation-settings: 'FILL' 0;">add</span>
<span class="font-body-md text-body-md font-medium">Custom</span>
</button>
</div>
</section>
<!-- STEP 2: Test Type -->
<section class="flex flex-col gap-md">
<h3 class="font-headline-md text-headline-md text-on-surface flex items-center gap-xs">
<span class="flex items-center justify-center w-6 h-6 rounded-full bg-surface-variant text-on-surface-variant font-label-md text-label-md">2</span>
                Test Type
            </h3>
<div class="flex flex-col md:flex-row gap-sm">
<!-- Type (Active) -->
<button class="flex-1 bg-primary-container/5 border border-primary-container ring-1 ring-primary-container rounded-xl p-md flex flex-row items-start text-left gap-sm transition-all active:scale-98">
<span class="material-symbols-outlined text-primary-container mt-1" style="font-variation-settings: 'FILL' 0;">library_books</span>
<div class="flex flex-col">
<span class="font-headline-md text-headline-md text-primary-container text-[16px]">Topic Wise</span>
<span class="font-body-md text-body-md text-on-surface-variant mt-1">Focus on specific chapters or concepts.</span>
</div>
</button>
<!-- Type (Inactive) -->
<button class="flex-1 bg-surface-container-lowest border border-outline-variant rounded-xl p-md flex flex-row items-start text-left gap-sm hover:border-primary-container transition-all active:scale-98">
<span class="material-symbols-outlined text-secondary mt-1" style="font-variation-settings: 'FILL' 0;">school</span>
<div class="flex flex-col">
<span class="font-headline-md text-headline-md text-on-surface text-[16px]">Entire Subject</span>
<span class="font-body-md text-body-md text-on-surface-variant mt-1">Comprehensive mock exam.</span>
</div>
</button>
</div>
</section>
<!-- STEP 3: Options (Chips / Segmented Controls) -->
<section class="flex flex-col gap-md bg-surface-container-lowest rounded-xl border border-outline-variant p-md">
<h3 class="font-headline-md text-headline-md text-on-surface flex items-center gap-xs border-b border-surface-variant pb-sm mb-xs">
<span class="flex items-center justify-center w-6 h-6 rounded-full bg-surface-variant text-on-surface-variant font-label-md text-label-md">3</span>
                Options
            </h3>
<!-- Difficulty -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant">Difficulty</label>
<div class="flex flex-wrap gap-xs">
<button class="px-md py-xs rounded-full bg-surface border border-outline-variant font-body-md text-body-md hover:bg-surface-variant transition-colors">Easy</button>
<button class="px-md py-xs rounded-full bg-primary-container border border-primary-container text-on-primary-container font-body-md text-body-md shadow-sm">Medium</button>
<button class="px-md py-xs rounded-full bg-surface border border-outline-variant font-body-md text-body-md hover:bg-surface-variant transition-colors">Hard</button>
</div>
</div>
<!-- Questions -->
<div class="flex flex-col gap-xs mt-sm">
<label class="font-label-md text-label-md text-on-surface-variant">Question Count</label>
<div class="flex flex-wrap gap-xs">
<button class="px-md py-xs rounded-full bg-surface border border-outline-variant font-body-md text-body-md hover:bg-surface-variant transition-colors">10</button>
<button class="px-md py-xs rounded-full bg-primary-container border border-primary-container text-on-primary-container font-body-md text-body-md shadow-sm">20</button>
<button class="px-md py-xs rounded-full bg-surface border border-outline-variant font-body-md text-body-md hover:bg-surface-variant transition-colors">30</button>
</div>
</div>
<!-- Timer -->
<div class="flex flex-col gap-xs mt-sm">
<label class="font-label-md text-label-md text-on-surface-variant">Time Limit</label>
<div class="flex flex-wrap gap-xs">
<button class="px-md py-xs rounded-full bg-surface border border-outline-variant font-body-md text-body-md hover:bg-surface-variant transition-colors flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">timer_off</span> No Limit
                    </button>
<button class="px-md py-xs rounded-full bg-surface border border-outline-variant font-body-md text-body-md hover:bg-surface-variant transition-colors flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">timer</span> 15m
                    </button>
<button class="px-md py-xs rounded-full bg-primary-container border border-primary-container text-on-primary-container font-body-md text-body-md shadow-sm flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">timer</span> 30m
                    </button>
</div>
</div>
</section>
</main>
<!-- Review & Final CTA (Fixed Bottom or inline, let's do fixed bottom for setup flow) -->
<div class="fixed bottom-0 left-0 w-full bg-surface-container-lowest border-t border-outline-variant px-margin-mobile py-md flex flex-col md:flex-row justify-between items-center gap-md z-40 shadow-[0px_-4px_20px_rgba(0,0,0,0.02)]">
<div class="hidden md:flex flex-col">
<span class="font-label-md text-label-md text-on-surface-variant">Review</span>
<span class="font-headline-md text-headline-md text-on-surface text-[16px]">Python • Topic Wise • 20 Qs</span>
</div>
<button class="w-full md:w-auto bg-primary-container text-on-primary-container font-headline-md text-headline-md py-sm px-xl rounded-xl flex items-center justify-center gap-sm hover:opacity-90 active:scale-95 transition-all shadow-[0px_4px_20px_rgba(108,76,241,0.2)]">
            Start Test
            <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
</button>
</div>
</body></html>
